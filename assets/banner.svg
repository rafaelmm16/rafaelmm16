<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0D1322" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.35" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="20%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>

    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Background -->
  <rect width="1200" height="320" rx="18" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="18" fill="url(#grid)" />
  <rect width="1200" height="320" rx="18" fill="url(#glowCyan)" />
  <rect width="1200" height="320" rx="18" fill="url(#glowPurple)" />

  <!-- Outer subtle border -->
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Top Accent Line -->
  <rect x="70" y="0" width="260" height="3" rx="1.5" fill="url(#accentGrad)" />

  <!-- Left Content Area -->
  <!-- Status Badge -->
  <g transform="translate(70, 52)">
    <rect x="0" y="0" width="295" height="30" rx="15" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="18" cy="15" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="19" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="0.4">
      DISPONÍVEL PARA PROJETOS &amp; CONEXÕES
    </text>
  </g>

  <!-- Name & Title -->
  <text x="70" y="136" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC" letter-spacing="-0.8">
    Rafael Merlo Mendes
  </text>

  <!-- Gradient Subtitle -->
  <text x="70" y="175" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="url(#accentGrad)" letter-spacing="0.2">
    Software Developer • Web &amp; Mobile
  </text>

  <!-- Bio tagline -->
  <text x="70" y="212" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94A3B8">
    Graduando em Sistemas de Informação &amp; Técnico em Informática. Construindo interfaces
  </text>
  <text x="70" y="234" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94A3B8">
    modernas, performáticas e experiências digitais completas com código limpo.
  </text>

  <!-- Tech Pills -->
  <g transform="translate(70, 256)" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="600">
    <rect x="0" y="0" width="96" height="28" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4" />
    <text x="48" y="18" fill="#38BDF8" text-anchor="middle">TypeScript</text>

    <rect x="108" y="0" width="70" height="28" rx="6" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.4" />
    <text x="143" y="18" fill="#818CF8" text-anchor="middle">React</text>

    <rect x="190" y="0" width="78" height="28" rx="6" fill="#0F172A" stroke="#C084FC" stroke-opacity="0.4" />
    <text x="229" y="18" fill="#C084FC" text-anchor="middle">Next.js</text>

    <rect x="280" y="0" width="110" height="28" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4" />
    <text x="335" y="18" fill="#38BDF8" text-anchor="middle">React Native</text>

    <rect x="402" y="0" width="78" height="28" rx="6" fill="#0F172A" stroke="#34D399" stroke-opacity="0.4" />
    <text x="441" y="18" fill="#34D399" text-anchor="middle">Node.js</text>
  </g>

  <!-- Right Decorative Code Terminal Card -->
  <g transform="translate(730, 42)">
    <!-- Card Shadow/Glow -->
    <rect x="0" y="0" width="405" height="236" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />

    <!-- Window Header -->
    <rect x="0" y="0" width="405" height="36" rx="12" fill="#0F172A" opacity="0.85" />
    <circle cx="20" cy="18" r="5.5" fill="#EF4444" opacity="0.85" />
    <circle cx="38" cy="18" r="5.5" fill="#F59E0B" opacity="0.85" />
    <circle cx="56" cy="18" r="5.5" fill="#10B981" opacity="0.85" />
    <text x="202" y="22" font-family="'Fira Code', Consolas, monospace" font-size="11.5" fill="#64748B" text-anchor="middle">
      rafael@dev:~/profile.ts
    </text>

    <!-- Code Lines -->
    <g transform="translate(22, 60)" font-family="'Fira Code', Consolas, monospace" font-size="12.5">
      <text x="0" y="0" fill="#64748B">1</text>
      <text x="24" y="0" fill="#C084FC">const</text>
      <text x="70" y="0" fill="#38BDF8">developer</text>
      <text x="145" y="0" fill="#E2E8F0">= {</text>

      <text x="0" y="24" fill="#64748B">2</text>
      <text x="40" y="24" fill="#94A3B8">role:</text>
      <text x="86" y="24" fill="#34D399">"Web &amp; Mobile Developer"</text>
      <text x="266" y="24" fill="#E2E8F0">,</text>

      <text x="0" y="48" fill="#64748B">3</text>
      <text x="40" y="48" fill="#94A3B8">degree:</text>
      <text x="100" y="48" fill="#34D399">"Sistemas de Informação"</text>
      <text x="280" y="48" fill="#E2E8F0">,</text>

      <text x="0" y="72" fill="#64748B">4</text>
      <text x="40" y="72" fill="#94A3B8">focus:</text>
      <text x="93" y="72" fill="#FBBF24">["UI/UX", "Clean Code", "Performance"]</text>
      <text x="366" y="72" fill="#E2E8F0">,</text>

      <text x="0" y="96" fill="#64748B">5</text>
      <text x="40" y="96" fill="#94A3B8">status:</text>
      <text x="100" y="96" fill="#38BDF8">"Building modern apps 🚀"</text>

      <text x="0" y="120" fill="#64748B">6</text>
      <text x="24" y="120" fill="#E2E8F0">};</text>

      <text x="0" y="150" fill="#64748B">7</text>
      <text x="24" y="150" fill="#10B981">➜</text>
      <text x="44" y="150" fill="#E2E8F0">rafaelmm16.github.io</text>
      <rect x="200" y="138" width="8" height="15" fill="#38BDF8">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>

